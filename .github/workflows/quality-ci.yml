# 전체 PR/푸시 대상 품질 검증 (타입체크 + lint + 단위 테스트)
name: Quality checks

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

jobs:
  quality:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
